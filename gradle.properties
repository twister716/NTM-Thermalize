# Root defaults. Values marked [VERSIONED] are set per node in versions/<node>/gradle.properties.

org.gradle.jvmargs=-Xmx3G -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Mod identity
mod.id=ntmthermalize
mod.name=NTM: Thermalize
mod.group=io.github.twister716.ntmthermalize
mod.version=1.0.0
mod.author=Twister716
mod.license=LGPL-3.0-only
mod.homepage=https://github.com/twister716/NTM-Thermalize
mod.sources=https://github.com/twister716/NTM-Thermalize
mod.issues=https://github.com/twister716/NTM-Thermalize/issues
# One short line, shown last in the mod list.
mod.credits=
mod.description=An addon for NTM - Continuum that introduces integration features with the Tough As Nails mod.

# Golem Core and NTM - Continuum: the versions of their GitHub releases the build uses (the jars attached to the release
# tagged v<version>). Golem Core is its -dev jar (with the harness listener), and the harness CLI comes from that release. GemRender
# comes from CurseMaven: each node's gradle.properties names its CurseForge file id (deps.gemrender).
deps.golemcore=1.0.4
deps.hbm=1.0.4
# The lowest Golem Core and NTM - Continuum versions the mod metadata accepts.
deps.golemcore_floor=1.0.4
deps.hbm_floor=1.0.4

# NTM: Space, an optional integration: the version of its GitHub release the build uses. The mod metadata accepts this
# version or newer. Tough As Nails and GlitchCore are set per node in versions/<node>/gradle.properties.
deps.ntmspace=1.0.1

# Golem Core's shared build scripts (gradle/golem, copied from Golem Core 1.0.4).
golem.build.dejson.classes=gradle/dejson-classes.txt
golem.build.dejson.authored=gradle/dejson-authored.txt
# HBM's item-model vocabulary and component smelting, so content written like HBM's converts for older nodes.
golem.build.legacyRecipes.componentSmeltingType=hbm:component_smelting
golem.build.legacyAssets.modelNamespace=hbm
golem.build.legacyAssets.selfRenderedSpecialTypes=hbm:machine_obj,hbm:rbmk_fuel_column,hbm:rbmk_block_column
golem.build.legacyAssets.selectProperties=hbm:model_state
# Release jars (build/release) drop the GameTests.
golem.build.releaseJar.testPackages=io/github/twister716/ntmthermalize/gametest/

# Release upload (gradle/golem/publish.gradle.kts documents every key). A blank project id skips that site. Tokens come
# from MODRINTH_TOKEN / CURSEFORGE_TOKEN or ~/.gradle/gradle.properties, never from this file.
golem.build.publish.modrinthProject=hibm1X56
golem.build.publish.curseforgeProject=1791457
golem.build.publish.modrinthRequires=sRSYLbXB,sr7XEjTN,ge1sOdFH,glitchcore
golem.build.publish.curseforgeRequires=golem-core,ntm-continuum,tough-as-nails,glitchcore
golem.build.publish.fabricRequires=fabric-api

# [VERSIONED] Per-node values. Optional per-node keys (deps.jei, deps.gemrender_flywheel, deps.neoforge_floor,
# deps.lwjgl, deps.sodium_neoforge, deps.sodium_fabric, deps.indium, deps.embeddium) are only in the node files that use them.
deps.minecraft=[VERSIONED]
deps.minecraft_range=[VERSIONED]
java_version=[VERSIONED]
pack_format=[VERSIONED]

deps.gemrender=[VERSIONED]

deps.fabric_loader=[VERSIONED]
deps.fabric_api=[VERSIONED]

deps.neoforge=[VERSIONED]
deps.neoforge_loader_range=[VERSIONED]

deps.forge=[VERSIONED]
deps.forge_loader_range=[VERSIONED]

loomx.loom_version=1.16.3
