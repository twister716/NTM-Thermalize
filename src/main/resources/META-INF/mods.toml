modLoader = "javafml"
loaderVersion = "${forge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@golem.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''
logoFile = "assets/ntmthermalize/icon.png"
displayURL = "@golem.homepage@"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_loader_range}"
ordering = "NONE"
side = "BOTH"

# AFTER both: Golem Core makes Forge's parallel mod construction wait for them.
[[dependencies.${mod_id}]]
modId = "golemcore"
mandatory = true
versionRange = "[${golemcore_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hbm"
mandatory = true
versionRange = "[${hbm_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "toughasnails"
mandatory = true
versionRange = "[${toughasnails_floor},)"
ordering = "AFTER"
side = "BOTH"

# Optional: not needed to run, but loaded first when the player has it installed.
[[dependencies.${mod_id}]]
modId = "ntmspace"
mandatory = false
versionRange = "[${ntmspace_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
