modLoader = "javafml"
loaderVersion = "${neoforge_loader_range}"
license = "${mod_license}"
issueTrackerURL = "@golem.issues@"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${mod_description}@golem.credits@'''
logoFile = "assets/ntmthermalize/icon.png"
displayURL = "@golem.homepage@"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

# AFTER both: the mod's constructor uses Golem Core's mod bus and HBM's registries.
[[dependencies.${mod_id}]]
modId = "golemcore"
type = "required"
versionRange = "[${golemcore_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "hbm"
type = "required"
versionRange = "[${hbm_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "toughasnails"
type = "required"
versionRange = "[${toughasnails_floor},)"
ordering = "AFTER"
side = "BOTH"

# Optional: not needed to run, but loaded first when the player has it installed.
[[dependencies.${mod_id}]]
modId = "ntmspace"
type = "optional"
versionRange = "[${ntmspace_floor},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
